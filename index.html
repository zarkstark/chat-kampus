<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat Kampus</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #232428;
      color: #f2f3f5;
    }

    header {
      padding: 18px 22px;
      background: #2b2d31;
      border-bottom: 1px solid #41434a;
    }

    h1 { margin: 0 0 7px; font-size: 22px; }

    #status { font-size: 13px; color: #b5bac1; }

    main {
      height: calc(100vh - 132px);
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      background: #313338;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      overflow-wrap: anywhere;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
    }

    .username { color: #9cbcff; font-weight: bold; }
    time { color: #b5bac1; font-size: 12px; }
    .message p { margin: 0; white-space: pre-wrap; }

    footer {
      padding: 14px;
      background: #2b2d31;
      display: grid;
      gap: 10px;
    }

    input, button {
      border: 0;
      border-radius: 7px;
      padding: 12px;
      font: inherit;
    }

    input {
      background: #1e1f22;
      color: white;
      min-width: 0;
    }

    form { display: flex; gap: 8px; }
    form input { flex: 1; }

    button {
      background: #5865f2;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover { background: #4752c4; }
    button:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>💬 Chat Kampus</h1>
    <div id="status">Belum terhubung</div>
  </header>

  <main id="messages" aria-live="polite"></main>

  <footer>
    <input id="username" maxlength="24"
      placeholder="Masukkan username">

    <form id="form">
      <input id="text" maxlength="500"
        placeholder="Tulis pesan..."
        autocomplete="off" required>
      <button id="send" type="submit">Kirim</button>
    </form>
  </footer>

  <script>
    const SERVER_URL = "https://chat-kampus.onrender.com";

    const statusEl = document.getElementById("status");
    const messages = document.getElementById("messages");
    const usernameInput = document.getElementById("username");
    const textInput = document.getElementById("text");
    const form = document.getElementById("form");

    window.chatAPI.onStatus((status) => {
      if (status === "connected") {
        statusEl.textContent = "Terhubung ke server";
      } else if (status === "error") {
        statusEl.textContent = "Gagal terhubung. Memeriksa server...";
      } else {
        statusEl.textContent = "Koneksi terputus. Mencoba menyambung...";
      }
    });

    window.chatAPI.onCount((count) => {
      statusEl.textContent = "Online: " + count + " pengguna";
    });

    window.chatAPI.onMessage((data) => {
      const item = document.createElement("article");
      item.className = "message";

      const meta = document.createElement("div");
      meta.className = "meta";

      const name = document.createElement("span");
      name.className = "username";
      name.textContent = data.username;

      const time = document.createElement("time");
      time.textContent = new Date(data.time).toLocaleTimeString("id-ID", {
        hour: "2-digit",
        minute: "2-digit",
      });

      const body = document.createElement("p");
      body.textContent = data.text;

      meta.append(name, time);
      item.append(meta, body);
      messages.append(item);
      messages.scrollTop = messages.scrollHeight;
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const name = usernameInput.value.trim();
      const message = textInput.value.trim();

      if (!name) {
        alert("Masukkan username terlebih dahulu.");
        usernameInput.focus();
        return;
      }

      if (!message) return;

      if (window.chatAPI.sendMessage(name, message)) {
        textInput.value = "";
        textInput.focus();
      } else {
        alert("Belum terhubung ke server. Coba lagi sebentar.");
      }
    });

    window.chatAPI.connect(SERVER_URL);
  </script>
</body>
</html>
